name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # SELF-HOSTED on mash1 (2026-09-23): hosted Actions stopped on a billing failure.
  # The guard keeps FORK pull requests off it (they run `fork-pr` below on a hosted
  # runner instead), the same trust split as tenishai/techne's test.yml. Stop the
  # runner at the go-public flip regardless (techne's go-public runbook).
  test:
    runs-on: [self-hosted, linux, x64, daedalus-ci]
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .[dev]
      - run: ruff check src tests docker
      - run: pytest -q

  # ---- fork-pr: the complement of test's guard, on a hosted runner -----------
  fork-pr:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .[dev]
      - run: ruff check src tests docker
      - run: pytest -q
