name: test

# test and fork-pr together cover every push to main and every PR (fork-pr
# runs whatever test's guard excludes) -- no private deps, no secret required.
# techne runs on workflow_dispatch only: it clones the techne sibling without a
# token, so it works once techne is public (agora#27).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # SELF-HOSTED on mash1 (2026-09-23): hosted Actions stopped on a billing failure.
  # The `if:` below is DEFENCE IN DEPTH for honest fork PRs, not a security boundary:
  # for `pull_request` GitHub runs the PR's own copy of this file, so a fork can
  # delete the guard (see the ATTACKER-EDITABLE block in tenishai/techne's test.yml).
  # The real controls: this repo is private, "Run workflows from fork pull requests"
  # is off (checked 2026-09-23), and the runner stops before the go-public flip.
  test:
    runs-on: [self-hosted, linux, x64, daedalus-ci]
    timeout-minutes: 20  # one small runner; a hung job starves it
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The runner CONTAINER persists between jobs (same machine name across legs), so
      # setup-python's interpreter in _work/_tool is shared: a bare `pip install` would
      # let one job's packages satisfy the next job's imports (liminal#103 r1). A fresh
      # venv per job, first on PATH, keeps each run to what it installed itself.
      # setup-python stays (proven on this runner) rather than the image's interpreters.
      - name: Fresh venv for this job
        run: |
          python -m venv --clear "$GITHUB_WORKSPACE/.venv-ci"
          echo "$GITHUB_WORKSPACE/.venv-ci/bin" >> "$GITHUB_PATH"
      - run: pip install -e .[dev]
      - run: ruff check src tests docker conftest.py
      - run: pytest -q

  # ---- techne: full suite with the private techne sibling --------------------
  # Manual dispatch only. The sibling checkout carries no token: while techne is
  # private this job cannot clone it, and once it is public it can -- then
  # consider `|| github.ref == 'refs/heads/main'`. Same shape as cabal's and
  # liminal's integration legs (agora#27, agora#31).
  #
  # DAEDALUS_REQUIRE_TECHNE=1 turns the three techne-path files' module-level
  # `pytest.importorskip("techne", ...)` from a quiet skip into a hard failure
  # (conftest.py) -- this leg exists to run those 92 tests, so a broken
  # or missing install must fail the build rather than report them skipped (#48).
  techne:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, x64, daedalus-ci]
    timeout-minutes: 20  # one small runner; a hung job starves it
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - name: Checkout daedalus
        uses: actions/checkout@v4
        with:
          path: daedalus

      - name: Checkout techne
        uses: actions/checkout@v4
        with:
          repository: tenishai/techne
          path: techne

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Same fresh-venv reasoning as the test job above: the runner container
      # persists between jobs, so a bare `pip install` would let this job's
      # techne install leak into the next job's (liminal#103 r1).
      - name: Fresh venv for this job
        run: |
          python -m venv --clear "$GITHUB_WORKSPACE/.venv-ci"
          echo "$GITHUB_WORKSPACE/.venv-ci/bin" >> "$GITHUB_PATH"

      - name: Install (with techne sibling)
        working-directory: daedalus
        run: |
          pip install -e "../techne[vectors]"
          pip install -e ".[dev]"

      - name: Ruff lint
        working-directory: daedalus
        run: ruff check src tests docker conftest.py

      - name: Pytest (full suite, techne required)
        working-directory: daedalus
        env:
          DAEDALUS_REQUIRE_TECHNE: "1"
        run: pytest -q

  # ---- fork-pr: the complement of test's guard, on a hosted runner -----------
  fork-pr:
    runs-on: ubuntu-latest
    # Techne's spelling (#590): the literal negation, so an event nobody named still
    # gets a hosted run instead of an empty Checks tab.
    if: ${{ !(github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .[dev]
      - run: ruff check src tests docker conftest.py
      - run: pytest -q
