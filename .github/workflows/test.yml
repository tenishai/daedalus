name: test

# Every job runs on a GitHub-hosted runner: a public repo must never let a pull
# request reach a self-hosted machine (agora discussion 71, rule 4). The `ci`
# job at the end is the one check the branch ruleset requires; it passes only
# when every test leg passed, so a skipped or cancelled leg never counts.
#
# Until 2026-11-23 `test` ran on a self-hosted pool (hosted Actions had stopped
# on a billing failure, 2026-09-23) behind a same-repo guard, with `fork-pr` as
# the hosted complement. Public repos get hosted minutes free, so there is one
# `test` job for everyone and no guard to delete.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Three legs, listed outright: two `include` entries for one python-version would
        # merge into one leg, not add a second. 3.12 with claude-code and bridge runs the
        # bridge's tests on mcp 2.x; 3.12 with claude-code and mcp<2 is how a set pinned to
        # mcp<2 installs it (tenishai/ergon#34); 3.11 has no mcp, so the "mcp not installed"
        # paths are tested too.
        include:
          - python-version: "3.11"
            extras: dev
            constraint: ""
          - python-version: "3.12"
            extras: dev,claude-code,bridge
            constraint: ""
          - python-version: "3.12"
            extras: dev,claude-code
            constraint: "mcp<2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[${{ matrix.extras }}]" ${{ matrix.constraint != '' && format('"{0}"', matrix.constraint) || '' }}
      - run: ruff check src tests docker conftest.py
      # Stdlib only. Fails when an anchored file changed without its arch card (#206).
      - run: python3 scripts/check_arch_cards.py
      - run: pytest -q

  # ---- techne: full suite with tenish-techne from the tenish index ------------
  # The `techne` extra installs tenish-techne from pypi.tenish.ai with the read-only
  # ergon-ci index token (repo secret TENISH_INDEX_TOKEN), as ergon's smoke job does.
  # A pull request from a fork gets no secrets, so this leg runs on pushes to main
  # and on demand, not as a pull-request gate, and `ci` does not need it. Once
  # techne is public the install can drop the token and this leg joins `ci`.
  #
  # DAEDALUS_REQUIRE_TECHNE=1 turns the techne-path files' module-level
  # `pytest.importorskip(...)` from a quiet skip into a hard failure (conftest.py):
  # this leg exists to run those tests, so a broken or missing install must fail the
  # build rather than report them skipped (#48).
  techne:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
      - name: Install (techne from the tenish index)
        env:
          UV_INDEX_TENISH_USERNAME: ergon-ci
          UV_INDEX_TENISH_PASSWORD: ${{ secrets.TENISH_INDEX_TOKEN }}
        run: |
          uv pip install --system --index tenish=https://pypi.tenish.ai/simple/ -e ".[dev,techne]"
          python -c "import importlib.metadata as m; print('tenish-techne', m.version('tenish-techne'))"
      - run: ruff check src tests docker conftest.py
      - name: Pytest (full suite, techne required)
        env:
          DAEDALUS_REQUIRE_TECHNE: "1"
        run: pytest -q

  # ---- dco: every commit a PR adds is signed off (CONTRIBUTING.md) -------------
  # Hosted runner, every pull request including forks. It checks out nothing and runs
  # no code from the PR: it fetches the two SHAs and reads commit metadata, with
  # GIT_NO_REPLACE_OBJECTS set so a refs/replace entry cannot change what it reads.
  #
  # Dependabot exemption: a commit authored exactly as
  # `dependabot[bot] <49699333+dependabot[bot]@users.noreply.github.com>` is skipped,
  # because Dependabot signs off as `dependabot[bot] <support@github.com>`, which never
  # matches its noreply author address. The skip applies only when the PR's head is this
  # repo: anyone who can push a branch here is already trusted, whereas a fork can forge
  # any author string, so a fork claiming to be dependabot still has to sign off.
  dco:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout (metadata only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history at checkout, so the check below needs no authenticated
          # fetch (credentials are not persisted, and the repo may be private).
          fetch-depth: 0
          persist-credentials: false
      - name: DCO sign-off check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          export GIT_NO_REPLACE_OBJECTS=1
          for sha in "$BASE_SHA" "$HEAD_SHA"; do
            git cat-file -e "$sha^{commit}" || { echo "::error::DCO: $sha is not in the checkout"; exit 1; }
          done
          commits=$(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA")
          if [ -z "$commits" ]; then
            echo "::error::DCO: no non-merge commits in $BASE_SHA..$HEAD_SHA, so nothing was checked"
            exit 1
          fi
          bad=0
          skipped=0
          for c in $commits; do
            author=$(git log -1 --format='%an <%ae>' "$c")
            if [ "$HEAD_REPO" = "$THIS_REPO" ] && [ "$author" = "dependabot[bot] <49699333+dependabot[bot]@users.noreply.github.com>" ]; then
              echo "DCO: skipping ${c:0:12} as a bot commit ($author)"
              skipped=$((skipped + 1))
              continue
            fi
            # no `grep -q`: an early exit SIGPIPEs `tr`, and pipefail reads that as a miss
            if ! git log -1 --format=%B "$c" | tr -d '\r' | grep -Fxi -- "Signed-off-by: $author" >/dev/null; then
              echo "::error::DCO: commit ${c:0:12} has no 'Signed-off-by: $author' trailer"
              bad=1
            fi
          done
          if [ "$bad" -ne 0 ]; then
            echo "Sign off with 'git commit -s'. To fix existing commits, see 'Developer Certificate of Origin' in CONTRIBUTING.md."
            exit 1
          fi
          echo "DCO: $(($(echo "$commits" | wc -l | tr -d ' ') - skipped)) commit(s) signed off by their authors$( [ "$skipped" -gt 0 ] && printf ' (%s skipped as bot commits)' "$skipped" )"

  # ---- ci: the summary the branch ruleset requires ------------------------------
  # `if: always()` so it reports even when a leg fails; it then fails unless every
  # leg of `test` succeeded (needs.test.result is the matrix's combined result).
  ci:
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = "success"
