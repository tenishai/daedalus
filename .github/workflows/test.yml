name: test

# test and fork-pr together cover every push to main and every PR (fork-pr
# runs whatever test's guard excludes) -- no private deps, no secret required.
# techne runs on workflow_dispatch only: it clones the techne sibling without a
# token, so it works once techne is public (agora#27).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # SELF-HOSTED (2026-09-23): hosted Actions stopped on a billing failure, so this job runs
  # on a self-hosted runner pool labelled daedalus-ci.
  # The `if:` below is DEFENCE IN DEPTH for honest fork PRs, not a security boundary:
  # for `pull_request` GitHub runs the PR's own copy of this file, so a fork can
  # delete the guard (see the ATTACKER-EDITABLE block in tenishai/techne's test.yml).
  # The real controls: this repo is private, "Run workflows from fork pull requests"
  # is off (checked 2026-09-23), and the runner stops before the go-public flip.
  test:
    runs-on: [self-hosted, linux, x64, daedalus-ci]
    timeout-minutes: 20  # one small runner; a hung job starves it
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
        # 3.12 adds the claude-code extra (mcp 2.x, uvicorn) so the engine bridge's tests
        # run; 3.11 stays without mcp so the "mcp not installed" paths are tested too.
        include:
          - python-version: "3.11"
            extras: dev
          - python-version: "3.12"
            extras: dev,claude-code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # The runner CONTAINER persists between jobs (same machine name across legs), so
      # a shared interpreter plus a bare `pip install` would let one job's packages
      # satisfy the next job's imports (liminal#103 r1). A fresh venv per job, first on
      # PATH, keeps each run to what it installed itself.
      # uv-managed Python, not actions/setup-python (#133): setup-python's builds on this
      # runner load libpython only through the LD_LIBRARY_PATH it exports, and exec.run
      # hands commands a clean environment, so every test_tools_exec test that runs
      # sys.executable exited 127. uv's builds run without it, like a normal install.
      - name: Fresh venv for this job
        run: |
          uv venv --clear --seed --managed-python --python "${{ matrix.python-version }}" "$GITHUB_WORKSPACE/.venv-ci"
          echo "$GITHUB_WORKSPACE/.venv-ci/bin" >> "$GITHUB_PATH"
      - run: pip install -e ".[${{ matrix.extras }}]"
      - run: ruff check src tests docker conftest.py
      - run: pytest -q

  # ---- techne: full suite with the private techne sibling --------------------
  # Manual dispatch only. The sibling checkout carries no token: while techne is
  # private this job cannot clone it, and once it is public it can -- then
  # consider `|| github.ref == 'refs/heads/main'`. Same shape as cabal's and
  # liminal's integration legs (agora#27, agora#31).
  #
  # DAEDALUS_REQUIRE_TECHNE=1 turns the three techne-path files' module-level
  # `pytest.importorskip("techne", ...)` from a quiet skip into a hard failure
  # (conftest.py) -- this leg exists to run those 92 tests, so a broken
  # or missing install must fail the build rather than report them skipped (#48).
  techne:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, x64, daedalus-ci]
    timeout-minutes: 20  # one small runner; a hung job starves it
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - name: Checkout daedalus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: daedalus

      - name: Checkout techne
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: tenishai/techne
          path: techne

      # Same fresh-venv and uv-managed-Python reasoning as the test job above
      # (liminal#103 r1, #133).
      - name: Fresh venv for this job
        run: |
          uv venv --clear --seed --managed-python --python "${{ matrix.python-version }}" "$GITHUB_WORKSPACE/.venv-ci"
          echo "$GITHUB_WORKSPACE/.venv-ci/bin" >> "$GITHUB_PATH"

      - name: Install (with techne sibling)
        working-directory: daedalus
        run: |
          pip install -e "../techne[vectors]"
          pip install -e ".[dev]"

      - name: Ruff lint
        working-directory: daedalus
        run: ruff check src tests docker conftest.py

      - name: Pytest (full suite, techne required)
        working-directory: daedalus
        env:
          DAEDALUS_REQUIRE_TECHNE: "1"
        run: pytest -q

  # ---- fork-pr: the complement of test's guard, on a hosted runner -----------
  fork-pr:
    runs-on: ubuntu-latest
    # Techne's spelling (#590): the literal negation, so an event nobody named still
    # gets a hosted run instead of an empty Checks tab.
    if: ${{ !(github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .[dev]
      - run: ruff check src tests docker conftest.py
      - run: pytest -q

  # ---- dco: every commit a PR adds is signed off (CONTRIBUTING.md) -------------
  # Hosted runner, every pull request including forks. It checks out nothing and runs
  # no code from the PR: it fetches the two SHAs and reads commit metadata, with
  # GIT_NO_REPLACE_OBJECTS set so a refs/replace entry cannot change what it reads.
  #
  # Dependabot exemption: a commit authored exactly as
  # `dependabot[bot] <49699333+dependabot[bot]@users.noreply.github.com>` is skipped,
  # because Dependabot signs off as `dependabot[bot] <support@github.com>`, which never
  # matches its noreply author address. The skip applies only when the PR's head is this
  # repo: anyone who can push a branch here is already trusted, whereas a fork can forge
  # any author string, so a fork claiming to be dependabot still has to sign off.
  dco:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout (metadata only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history at checkout, so the check below needs no authenticated
          # fetch (credentials are not persisted, and the repo may be private).
          fetch-depth: 0
          persist-credentials: false
      - name: DCO sign-off check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          export GIT_NO_REPLACE_OBJECTS=1
          for sha in "$BASE_SHA" "$HEAD_SHA"; do
            git cat-file -e "$sha^{commit}" || { echo "::error::DCO: $sha is not in the checkout"; exit 1; }
          done
          commits=$(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA")
          if [ -z "$commits" ]; then
            echo "::error::DCO: no non-merge commits in $BASE_SHA..$HEAD_SHA, so nothing was checked"
            exit 1
          fi
          bad=0
          skipped=0
          for c in $commits; do
            author=$(git log -1 --format='%an <%ae>' "$c")
            if [ "$HEAD_REPO" = "$THIS_REPO" ] && [ "$author" = "dependabot[bot] <49699333+dependabot[bot]@users.noreply.github.com>" ]; then
              echo "DCO: skipping ${c:0:12} as a bot commit ($author)"
              skipped=$((skipped + 1))
              continue
            fi
            # no `grep -q`: an early exit SIGPIPEs `tr`, and pipefail reads that as a miss
            if ! git log -1 --format=%B "$c" | tr -d '\r' | grep -Fxi -- "Signed-off-by: $author" >/dev/null; then
              echo "::error::DCO: commit ${c:0:12} has no 'Signed-off-by: $author' trailer"
              bad=1
            fi
          done
          if [ "$bad" -ne 0 ]; then
            echo "Sign off with 'git commit -s'. To fix existing commits, see 'Developer Certificate of Origin' in CONTRIBUTING.md."
            exit 1
          fi
          echo "DCO: $(($(echo "$commits" | wc -l | tr -d ' ') - skipped)) commit(s) signed off by their authors$( [ "$skipped" -gt 0 ] && printf ' (%s skipped as bot commits)' "$skipped" )"
