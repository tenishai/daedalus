[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "daedalus"
dynamic = ["version"]
description = "Agent construction kit — an agent is a directory."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
authors = [{ name = "tenishai" }]
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "click>=8.1",
    "litellm>=1.40",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
a2a = ["fastapi>=0.110", "uvicorn>=0.29", "joserfc>=0.9", "httpx>=0.27"]
slack = ["slack-sdk>=3.27", "aiohttp>=3.9"]
# memory.techne.TechneMemoryStore defaults use_vectors=True, which needs
# techne >= 0.16.1 (techne#827); 0.17.0 is the current release. techne is not on
# a public index, and the "techne" on PyPI is an unrelated package: today's (0.0.2)
# fails this floor, but a floor is not name ownership, so install through
# requirements-sources.txt, which supplies the concrete source.
techne = ["techne[vectors]>=0.17.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "joserfc>=0.9",
]

[project.scripts]
daedalus = "daedalus.cli:main"

[project.urls]
Homepage = "https://github.com/tenishai/daedalus"

[tool.hatch.version]
path = "src/daedalus/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/daedalus"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "docker"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "docker"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
