# Claude for the tiers that need judgment, a LAN model for the cheap one. This is the
# shape of the tenish deployment on mash1.
tiers:
  high:   {engine: claude-code, id: claude-opus-5-5}
  medium: {engine: claude-code, id: claude-sonnet-5-5}
  cheap:
    engine: litellm
    id: openai/mtplx-qwen35-9b-optimized-speed
    api_base: http://192.168.10.202:8000/v1
    api_key_env: MTPLX_API_KEY
    context_tokens: 45000                 # measured ceiling ~55-60k on a 24 GB Mac
    max_repeats: 3
