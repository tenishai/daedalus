# Slack app manifest for a daedalus bundle with the slack transport.
# Create at api.slack.com/apps -> Create New App -> From a manifest.
# After creating: generate an App-Level Token (connections:write) for
# SLACK_APP_TOKEN, install to the workspace for SLACK_BOT_TOKEN, and invite
# the bot to your channel. Inviting it is the whole setup for ANSWERING — a
# bare `- kind: slack` block in agent.yaml answers wherever the app is a
# member. It does not enable tier-2 approvals: those are DENIED unless the
# block names both a `channel:` and `approvers: [U012ABC]` (Slack user ids;
# for a request that started in Slack, its sender cannot approve it unless
# they are the only listed approver; requests from a2a/cli/colleagues have no
# Slack requester, so that rule does not apply to them. The list is
# transport-wide (unioned across blocks), not per channel).
# Add `channel: C012ABC` lines only when you want the narrower thing: an
# allowlist that holds even inside channels the app has been invited to.
# Public AND private channel grants are both included below (channels:
# history + groups:history, message.channels + message.groups) rather than
# one swapped in for the other: a bundle can't know ahead of time which
# type of channel it'll be invited to, and modern Slack has no separate
# legacy "G"-prefixed private-channel id space to special-case for — both
# public and private channels use C-prefixed ids today.

# DIRECT MESSAGES ARE NOT SUBSCRIBED, ON PURPOSE. Adding `im:history` (and
# `mpim:history`) with the `message.im` (and `message.mpim`) event turns on DMs,
# and DMs bypass the `channel:` allowlist: anyone in the workspace who can open
# a DM with the app reaches the model and every tool the bundle allows, with
# only the bundle's tool ceiling as the limit. There is no per-user allowlist.
# Subscribe to them only when that is what you want (docs/design.md, 2.4).

display_information:
  name: Scout
  description: A daedalus agent bundle, reachable in Slack.
  background_color: "#3d2f5b"

features:
  bot_user:
    display_name: scout
    always_online: true

oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - groups:history
      - chat:write
      - reactions:read
      - reactions:write

settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
