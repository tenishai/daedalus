name: greeter
card: agent-card.json
persona: persona.md

model:
  id: ${GREETER_MODEL:-anthropic/claude-sonnet-4-5}
  max_tokens: 1024
  request_timeout: 60     # seconds per model call (#201; default 120)
  budget:
    per_task_tokens: 50000

transports:
  - kind: cli

tools:
  provider: none
  allow: []

memory:
  personal: none
  team: none

task_timeout: 300         # seconds per task, model and tool calls together (#201; default 600)

approvals:
  ceiling:
    write: false
  gates:
    - match: "files.write"
      require: plan_approval
  escalation:
    route: cli
