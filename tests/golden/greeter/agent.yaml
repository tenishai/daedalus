name: greeter
card: agent-card.json
persona: persona.md

model:
  id: ${GREETER_MODEL:-anthropic/claude-sonnet-4-5}
  max_tokens: 1024        # the visible reply's ceiling; thinking is budgeted below
  thinking:               # (#240) auto: known reasoning models think, within budget_tokens
    mode: auto            # on top of max_tokens; off: ask the route not to think
    budget_tokens: 2048
  request_timeout: 60     # seconds per model call (#201; default 120)
  budget:
    per_task_tokens: 50000

transports:
  - kind: cli

tools:
  provider: none
  allow: []
  compact:                # stub old tool results once a prompt reaches at_tokens
    at_tokens: 40000      # (litellm engine; absent = never)
    keep_recent: 4

memory:
  personal: none
  team: none

task_timeout: 300         # seconds per task, model and tool calls together (#201; default 600)

approvals:
  ceiling:
    write: false
  gates:
    - match: "files.write"
      require: plan_approval
  escalation:
    route: cli
